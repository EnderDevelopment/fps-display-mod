plugins {
    id 'fabric-loom' version '1.1-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.4'
    mappings 'net.fabricmc:yarn:1.20.4+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.14.0'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.76.0+1.20.4'
}

loom {
    refreshDeps = true
    ide {
        runConfigs {
            create('client') {
                name = 'Client'
                mainClass = 'net.fabricmc.devlaunchinjector.Main'
                workingDir project.file('run')
                args '--assetIndex', '1.20.4', '--assetsDir', 'assets', '--gameDir', 'run'
                jvmArgs '-Dfabric.dli.config=run/dli-config.json'
            }
        }
    }
}
